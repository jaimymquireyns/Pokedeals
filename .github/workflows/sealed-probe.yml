name: Proef sealed aanbiedingen
on:
  push:
    branches: [analysis/sets]
    paths: [collector/sealed_probe.py, .github/workflows/sealed-probe.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r collector/requirements.txt
      - name: Proef
        working-directory: collector
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          PKMN_API_KEY: ${{ secrets.PKMN_API_KEY }}
        run: python sealed_probe.py
      - name: Bewaren
        run: |
          git config user.name "pokedeals-bot"; git config user.email "bot@users.noreply.github.com"
          git add reports/sealed_probe.md
          git commit -m "Sealed proef" || exit 0
          git pull --rebase -q && git push
