name: Test PokemonPriceTracker

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r collector/requirements.txt
      - name: Toon wat PokemonPriceTracker teruggeeft
        working-directory: collector
        env:
          PPT_API_KEY: ${{ secrets.PPT_API_KEY }}
          PKMN_API_KEY: ${{ secrets.PKMN_API_KEY }}
        run: python run.py --probe-ppt
