name: Controle dagelijkse update
on:
  push:
    branches: [analysis/sets]
    paths: [collector/diag_today.py, .github/workflows/analysis-diag.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r collector/requirements.txt
      - name: Exporteren
        working-directory: collector
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python diag_today.py /tmp/export.json.gz
      - name: Versleutelen
        run: |
          mkdir -p reports
          openssl rand -out /tmp/k.bin 32
          openssl enc -aes-256-cbc -pbkdf2 -in /tmp/export.json.gz -out reports/export.enc -pass file:/tmp/k.bin
          openssl pkeyutl -encrypt -pubin -inkey collector/export_pub.pem -pkeyopt rsa_padding_mode:oaep -in /tmp/k.bin -out reports/export.key.enc
          rm -f /tmp/k.bin /tmp/export.json.gz
      - name: Bewaren
        run: |
          git config user.name "pokedeals-bot"; git config user.email "bot@users.noreply.github.com"
          git add reports/export.enc reports/export.key.enc
          git commit -m "Versleutelde export" || exit 0
          git pull --rebase -q && git push
