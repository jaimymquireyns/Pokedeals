name: Signalen (marktmomentopname + meersignalen)

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:
    inputs:
      backtest:
        description: "Ook de backtest per signaal draaien? (ja/nee)"
        default: "ja"

concurrency:
  group: pokedeals-signals
  cancel-in-progress: false

jobs:
  signalen:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: collector/requirements.txt
      - run: pip install -r collector/requirements.txt
      - name: Signalen berekenen
        working-directory: collector
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          PKMN_API_KEY: ${{ secrets.PKMN_API_KEY }}
          BACKTEST: ${{ github.event.inputs.backtest }}
        run: |
          if [ "$BACKTEST" = "ja" ]; then python signals.py --backtest --skip-snapshot; else python signals.py --skip-snapshot; fi   # momentopname uit (20 okt): kost credits, wordt niet meer gebruikt
