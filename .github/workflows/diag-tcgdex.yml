name: Diagnose TCGdex (tijdelijk)
on:
  push:
    branches: [diag/tcgdex]
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for ip in 51.255.35.48 51.79.240.39 142.44.242.175; do
            echo "== via $ip"
            curl -sS -m 20 --resolve api.tcgdex.net:443:$ip https://api.tcgdex.net/v2/en/sets/30th | python3 -c "import json,sys;d=json.load(sys.stdin);print('cards',len(d.get('cards',[])))" || echo fout
            curl -sS -m 20 --resolve api.tcgdex.net:443:$ip https://api.tcgdex.net/v2/en/cards/30th-149 | python3 -c "import json,sys;d=json.load(sys.stdin);print('trend',((d.get('pricing') or {}).get('cardmarket') or {}).get('trend'))" || echo fout
          done
