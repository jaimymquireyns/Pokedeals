name: Import aankopen en verkopen
on:
  push:
    branches: [analysis/sets]
    paths: [import/start]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r collector/requirements.txt
      - name: Sleutel maken en publieke helft delen
        run: |
          git config user.name "pokedeals-bot"; git config user.email "bot@users.noreply.github.com"
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out /tmp/priv.pem 2>/dev/null
          openssl pkey -in /tmp/priv.pem -pubout -out import/runner_pub.pem
          rm -f import/plan.enc import/plan.key.enc
          git add -A import && git commit -m "Import: sleutel van deze run" && git pull --rebase -q && git push
      - name: Wachten op versleuteld plan
        run: |
          for i in $(seq 1 100); do
            git pull -q --rebase || true
            if [ -f import/plan.enc ] && [ -f import/plan.key.enc ]; then echo gevonden; exit 0; fi
            sleep 10
          done
          echo "geen plan ontvangen"; exit 1
      - name: Ontsleutelen
        run: |
          openssl pkeyutl -decrypt -inkey /tmp/priv.pem -pkeyopt rsa_padding_mode:oaep -in import/plan.key.enc -out /tmp/k.bin
          openssl enc -d -aes-256-cbc -pbkdf2 -in import/plan.enc -out /tmp/plan.json -pass file:/tmp/k.bin
      - name: Import
        working-directory: collector
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python import_apply.py /tmp/plan.json /tmp/backup.json /tmp/log.json
      - name: Backup en verslag versleuteld bewaren
        if: always()
        run: |
          mkdir -p reports
          tar czf /tmp/out.tgz -C /tmp $(cd /tmp && ls backup.json log.json 2>/dev/null)
          openssl rand -out /tmp/k2.bin 32
          openssl enc -aes-256-cbc -pbkdf2 -in /tmp/out.tgz -out reports/import_result.enc -pass file:/tmp/k2.bin
          openssl pkeyutl -encrypt -pubin -inkey collector/export_pub.pem -pkeyopt rsa_padding_mode:oaep -in /tmp/k2.bin -out reports/import_result.key.enc
          git rm -q --cached import/plan.enc import/plan.key.enc 2>/dev/null; rm -f import/plan.enc import/plan.key.enc
          git add -A reports import && git commit -m "Import: backup en verslag (versleuteld)" && git pull --rebase -q && git push
