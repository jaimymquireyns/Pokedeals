name: Terugtest advies
on:
  schedule:
    - cron: "40 23 * * *"   # elke avond na de credits-taak: de geschiedenis groeit, de kans wordt preciezer
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pokedeals-backtest
  cancel-in-progress: false
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r collector/requirements.txt
      - name: Terugtest
        working-directory: collector
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python advice_backtest.py --out ../reports/advice_backtest.md
      - name: Verslag bewaren (branch reports)
        run: |
          git config user.name "pokedeals-bot"; git config user.email "bot@users.noreply.github.com"
          cp reports/advice_backtest.md /tmp/bt.md
          git fetch -q origin reports || true
          git checkout -q -B reports origin/reports 2>/dev/null || git checkout -q --orphan reports
          git rm -rq --cached . >/dev/null 2>&1 || true
          mkdir -p reports && cp /tmp/bt.md reports/advice_backtest.md
          git add reports/advice_backtest.md
          git commit -qm "Terugtest advies $(date -u +%F)" || exit 0
          git push -q origin reports
