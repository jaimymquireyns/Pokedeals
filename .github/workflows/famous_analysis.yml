name: Beroemde Pokémon analyseren (backtest + zoekinteresse)

on:
  workflow_dispatch:
    inputs:
      n:
        description: "Aantal prijssprongen om de zoekinteresse bij op te halen (elk ~10 credits bij Scrape.do)"
        default: "5"
      geo:
        description: "Landcode, bijv. NL of US (leeg = wereldwijd)"
        default: ""

concurrency:
  group: pokedeals-trends
  cancel-in-progress: false

jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: collector/requirements.txt
      - run: pip install -r collector/requirements.txt
      - name: Analyseren
        working-directory: collector
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SCRAPEDO_API_KEY: ${{ secrets.SCRAPEDO_API_KEY }}
          N: ${{ github.event.inputs.n }}
          GEO: ${{ github.event.inputs.geo }}
        run: |
          args="--n ${N:-5}"
          if [ -n "$GEO" ]; then args="$args --geo $GEO"; fi
          echo "python famous_analysis.py $args"
          eval python famous_analysis.py $args
