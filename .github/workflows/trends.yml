name: Zoekinteresse testen (Google Trends)

on:
  workflow_dispatch:
    inputs:
      terms:
        description: "Eigen zoektermen, komma-gescheiden (leeg = de standaardtest met Electivire e.a., 80 credits)"
        default: ""
      geo:
        description: "Landcode, bijv. NL of US (leeg = wereldwijd)"
        default: ""

concurrency:
  group: pokedeals-trends
  cancel-in-progress: false

jobs:
  trends:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: collector/requirements.txt
      - run: pip install -r collector/requirements.txt
      - name: Zoekinteresse ophalen
        working-directory: collector
        env:
          SCRAPEDO_API_KEY: ${{ secrets.SCRAPEDO_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          TERMS: ${{ github.event.inputs.terms }}
          GEO: ${{ github.event.inputs.geo }}
        run: |
          args=""
          if [ -n "$TERMS" ]; then args="$args --terms \"$TERMS\""; fi
          if [ -n "$GEO" ]; then args="$args --geo $GEO"; fi
          echo "python trends_probe.py $args"
          eval python trends_probe.py $args
