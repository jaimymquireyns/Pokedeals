name: Credits opmaken (laat op de dag)

on:
  schedule:
    - cron: "30 23 * * *"   # 23:30 UTC = ongeveer 00:30 (winter) tot 01:30 (zomer) Belgische tijd; pas aan als het echte reset-moment van PkmnPrices anders blijkt
  workflow_dispatch:

concurrency:
  group: pokedeals-data
  cancel-in-progress: false

jobs:
  credits:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: collector/requirements.txt
      - run: pip install -r collector/requirements.txt
      - name: Overgebleven PkmnPrices-credits benutten
        working-directory: collector
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          PKMN_API_KEY: ${{ secrets.PKMN_API_KEY }}
        run: python run.py --credits-only
